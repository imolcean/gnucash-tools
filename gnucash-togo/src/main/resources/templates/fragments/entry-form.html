<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  The entry form, shared by / and /transactions/{guid}/edit. htmx swaps the whole form on save, quick-fill and
  account picks (hx-swap="outerHTML" on the form, which children inherit: every other hx-* element sets its own).
  The server renders every state. Suggestion lists close on focusout through /suggest/none.
*/-->
<form th:fragment="form" id="entry-form" class="entry" novalidate
      th:hx-post="${form.editing} ? @{/transactions/{tx}(tx=${form.txGuid})} : @{/}"
      hx-target="this" hx-swap="outerHTML"
      th:with="editing=${form.editing}">
    <p class="saved" role="status" th:if="${saved}" th:text="#{entry.saved(${saved})}">Saved: Rewe · 12.34 € · Cash → Groceries</p>
    <p class="alert" role="alert" th:if="${refusal}" th:text="#{entry.refused(${refusal})}">Not saved: Locked by Leopard (PID 8300)</p>

    <input type="hidden" name="txGuid" th:value="${form.txGuid}">
    <input type="hidden" name="returnTo" th:value="${form.returnTo}">

    <div class="row">
        <label><span th:text="#{entry.date}">Date</span>
            <input type="date" name="date" id="date" required th:value="${form.date}"
                   th:aria-invalid="${errors.containsKey('date')} ? 'true'">
        </label>
        <button type="button" class="secondary outline" hx-get="/entry/today" hx-target="#date" hx-swap="outerHTML"
                th:text="#{entry.today}">Today</button>
    </div>
    <small class="field-error" th:if="${errors.containsKey('date')}" th:text="#{${errors.date}}">Pick a date.</small>

    <!--/* Tag chips: tags.js adds and removes them; each chip carries a hidden "tags" input. */-->
    <label for="tag-input" th:text="#{entry.tags}">Tags</label>
    <div class="chips" id="chips"><span class="chip" th:each="tag : ${form.tags}"><span th:text="${tag}">Tag 1</span><input
            type="hidden" name="tags" th:value="${tag}"><button type="button" data-remove-tag
            th:aria-label="#{entry.removeTag(${tag})}">×</button></span></div>
    <div class="picker" hx-get="/suggest/none" hx-trigger="focusout delay:300ms" hx-swap="innerHTML" hx-target="#tag-suggestions">
        <input id="tag-input" name="tag" autocomplete="off" autocapitalize="none" th:value="${form.tag}"
               th:placeholder="#{entry.tags.placeholder}" th:aria-invalid="${errors.containsKey('tags')} ? 'true'"
               hx-get="/suggest/tags" hx-trigger="input changed delay:250ms, focus" hx-target="#tag-suggestions"
               hx-swap="innerHTML" hx-include="#chips">
        <ul class="suggestions" id="tag-suggestions"></ul>
    </div>
    <small class="field-error" th:if="${errors.containsKey('tags')}" th:text="#{${errors.tags}}">No brackets.</small>

    <div class="picker" hx-get="/suggest/none" hx-trigger="focusout delay:300ms" hx-swap="innerHTML" hx-target="#text-suggestions">
        <label><span th:text="#{entry.description}">Description</span>
            <input name="text" autocomplete="off" th:value="${form.text}"
                   hx-get="/suggest/descriptions" hx-trigger="input changed delay:250ms" hx-target="#text-suggestions"
                   hx-swap="innerHTML">
        </label>
        <ul class="suggestions" id="text-suggestions"></ul>
    </div>

    <label><span th:text="#{entry.amount}">Amount</span> <small class="muted" th:text="${fromCurrency}">€</small>
        <input name="amount" inputmode="decimal" autocomplete="off" th:value="${form.amount}"
               th:aria-invalid="${errors.containsKey('amount')} ? 'true'">
    </label>
    <small class="field-error" th:if="${errors.containsKey('amount')}" th:text="#{${errors.amount}}">Not a number.</small>

    <th:block th:replace="~{fragments/entry-form :: picker('from', ${form.from}, ${form.fromLabel}, ${fromCurrency})}"></th:block>
    <th:block th:replace="~{fragments/entry-form :: picker('to', ${form.to}, ${form.toLabel}, ${toCurrency})}"></th:block>

    <details th:open="${!form.notes.isEmpty()}">
        <summary th:text="#{entry.notes}">Notes</summary>
        <textarea name="notes" rows="2" th:aria-label="#{entry.notes}" th:text="${form.notes}"></textarea>
    </details>

    <button type="submit" th:disabled="${writable == false}" th:text="#{entry.save}">Save</button>
    <th:block th:if="${editing}">
        <a role="button" class="secondary outline" th:href="${form.returnTo}" th:text="#{entry.cancel}">Cancel</a>
        <button type="button" class="secondary" th:disabled="${writable == false}"
                th:hx-post="@{/transactions/{tx}/delete(tx=${form.txGuid})}"
                hx-target="#entry-form" hx-swap="outerHTML" th:hx-confirm="#{entry.delete.confirm}"
                th:text="#{entry.delete}">Delete</button>
    </th:block>
</form>

<!--/* One account picker: a search box, the picked GUID, and its suggestions. */-->
<div th:fragment="picker(field, guid, label, currency)" class="picker"
     hx-get="/suggest/none" hx-trigger="focusout delay:300ms" hx-swap="innerHTML" th:hx-target="|#${field}-suggestions|">
    <label><span th:text="#{${'entry.' + field}}">From</span> <small class="muted" th:text="${currency}">€</small>
        <input th:name="|${field}Label|" autocomplete="off" th:value="${label}" th:placeholder="#{entry.account.placeholder}"
               th:aria-invalid="${errors.containsKey(field)} ? 'true'"
               th:hx-get="@{/suggest/accounts(field=${field})}" hx-trigger="input changed delay:250ms, focus"
               th:hx-target="|#${field}-suggestions|" hx-swap="innerHTML" th:hx-include="|#${field}-guid|">
    </label>
    <input type="hidden" th:id="|${field}-guid|" th:name="${field}" th:value="${guid}">
    <ul class="suggestions" th:id="|${field}-suggestions|"></ul>
    <small class="field-error" th:if="${errors.containsKey(field)}" th:text="#{${errors.get(field)}}">Pick an account.</small>
</div>
</body>
</html>
