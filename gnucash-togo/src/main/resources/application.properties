spring.application.name=gnucash-togo

# The book; the login supplies user and password (ADR-0006).
togo.db.host=${GNUCASH_DB_HOST:}
togo.db.port=${GNUCASH_DB_PORT:5432}
togo.db.name=${GNUCASH_DB_NAME:}

# Rows per register page; "Load more" fetches the next one.
togo.register.page-size=50

# Sessions live in memory (ADR-0006). The cookie lasts a year, so a phone keeps it when the browser closes;
# a session unused for 90 days ends and closes its pool. Re-login after that or after a restart.
server.servlet.session.timeout=90d
server.servlet.session.cookie.max-age=365d

management.endpoints.web.exposure.include=health
