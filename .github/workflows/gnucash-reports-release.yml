name: gnucash-reports release

# On a tag gnucash-reports/v1.2.3: tests gnucash-reports and attaches gnucash-reports-1.2.3.zip (the
# fincore-reports folder a user copies into GnuCash's user data folder) to a GitHub release for that tag.

on:
  push:
    tags: ['gnucash-reports/v*']

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tests pull a pinned tag. If it is not published (yet), build it here from the same Dockerfile.
      - name: GnuCash test image
        run: |
          image=$(./mvnw -B -q -N -f gnucash-reports/pom.xml help:evaluate -Dexpression=gnucash.image -DforceStdout)
          docker pull "$image" || docker build -t "$image" gnucash-reports/docker

      # gnucash-reports and what it needs (gnucash-book), as in gnucash-reports-test.yml.
      - name: Run tests and package
        run: ./mvnw -B verify -pl gnucash-reports -am

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#gnucash-reports/v}"
          cp gnucash-reports/target/gnucash-reports-*.zip "gnucash-reports-${version}.zip"
          gh release create "$GITHUB_REF_NAME" "gnucash-reports-${version}.zip" \
            --title "gnucash-reports ${version}" \
            --notes "Sankey reports for GnuCash desktop 5.16. Install: gnucash-reports/README.md."
