name: gnucash-reports tests

# Runs gnucash-reports' tests, and those of the modules it is built from, on every change that can affect them.
# The reports render in GnuCash's command line inside a container; the Postgres book comes from gnucash-book's
# test fixture, which is why gnucash-book's changes run this too. Other modules have their own workflows, and
# this one does not build or publish any of their images.

on:
  push:
    branches: [master]
    paths: &paths
      - 'gnucash-reports/**'
      - 'gnucash-book/**'
      - 'pom.xml'
      - '.mvn/**'
      - '.github/workflows/gnucash-reports-test.yml'
  pull_request:
    branches: [master]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The tests pull a pinned image published by gnucash-reports-image.yml. If that tag is not in the registry
      # (yet, or the package is not readable), build it here from the same Dockerfile.
      - name: GnuCash test image
        run: |
          image=$(./mvnw -B -q -N -f gnucash-reports/pom.xml help:evaluate -Dexpression=gnucash.image -DforceStdout)
          docker pull "$image" || docker build -t "$image" gnucash-reports/docker

      # gnucash-reports and what it needs (gnucash-book), with the Testcontainers tests (Docker is on the runner).
      - name: Run tests
        run: ./mvnw -B verify -pl gnucash-reports -am
